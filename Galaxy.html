<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animated Milky Way Galaxy</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background:
        radial-gradient(circle at center,
        #10154a 0%,
        #05071d 45%,
        #010207 100%);
    font-family: Arial, sans-serif;
}

/* Instagram-friendly 3:4 */
.galaxy-container {
    position: relative;
    width: min(75vh, 95vw);
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 24px;

    background:
        radial-gradient(circle at center,
        #181b59,
        #06091f 45%,
        #010208 100%);

    box-shadow:
        0 0 70px rgba(70,100,255,.4),
        inset 0 0 100px rgba(0,0,0,.85);
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.title {
    position: absolute;
    top: 4%;
    width: 100%;
    text-align: center;
    color: white;
    letter-spacing: 7px;
    font-size: clamp(20px, 4vw, 44px);
    font-weight: bold;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #58a6ff,
        0 0 50px #8b5cff;

    pointer-events: none;
}

.subtitle {
    position: absolute;
    top: 8%;
    width: 100%;
    text-align: center;
    color: #9fcfff;
    font-size: clamp(9px, 1.5vw, 16px);
    letter-spacing: 4px;
    opacity: .8;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="galaxy-container">

    <canvas id="galaxy"></canvas>

    <div class="title">MILKY WAY</div>

    <div class="subtitle">
        OUR GALAXY IN MOTION
    </div>

</div>

<script>

const canvas = document.getElementById("galaxy");
const ctx = canvas.getContext("2d");

/* Instagram 3:4 resolution */
canvas.width = 1080;
canvas.height = 1440;

const W = canvas.width;
const H = canvas.height;

const centerX = W / 2;
const centerY = H / 2 + 70;


/* ================================
   BACKGROUND STARS
================================ */

const backgroundStars = [];

for (let i = 0; i < 750; i++) {

    backgroundStars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2.3 + 0.3,
        twinkle: Math.random() * 0.004 + 0.001,
        phase: Math.random() * Math.PI * 2
    });

}


/* ================================
   MILKY WAY STARS
================================ */

/* Increased from 1600 */
const STAR_COUNT = 2400;

const galaxyStars = [];

const arms = 5;

const colors = [
    "#ffffff",
    "#dff6ff",
    "#a8d8ff",
    "#65b8ff",
    "#8d8cff",
    "#c6a8ff",
    "#ff8be7",
    "#ffb0e9",
    "#ffe5a3"
];


for (let i = 0; i < STAR_COUNT; i++) {

    /*
       Larger radius:
       previous maximum = 430
       new maximum = 620
    */

    const radius =
        Math.pow(Math.random(), 0.65) * 620;


    const arm =
        Math.floor(Math.random() * arms);


    const armAngle =
        arm * (Math.PI * 2 / arms);


    /*
       Spiral curvature
    */

    const spiral =
        radius * 0.018;


    /*
       Adds natural randomness
       around each spiral arm
    */

    const spread =
        (Math.random() - 0.5) *
        (0.75 + radius / 500);


    const angle =
        armAngle +
        spiral +
        spread;


    /*
       MUCH FASTER ROTATION

       Inner stars rotate faster
       than outer stars.
    */

    const speed =
        0.00065 +
        (1 - radius / 700) *
        0.0035;


    galaxyStars.push({

        radius: radius,

        angle: angle,

        speed: speed,

        size:
            Math.random() * 3.3 + 0.5,

        color:
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ],

        alpha:
            Math.random() * 0.8 + 0.2,

        offsetY:
            (Math.random() - 0.5) *
            radius *
            0.11

    });

}


/* ================================
   SHOOTING STARS
================================ */

const shootingStars = [];


function createShootingStar() {

    shootingStars.push({

        x: Math.random() * W * 0.65,

        y: Math.random() * H * 0.35,

        vx: 12 + Math.random() * 12,

        vy: 7 + Math.random() * 7,

        life: 1

    });

}


/* ================================
   BACKGROUND
================================ */

function drawBackground(time) {

    const gradient =
        ctx.createRadialGradient(
            centerX,
            centerY,
            10,
            centerX,
            centerY,
            900
        );


    gradient.addColorStop(
        0,
        "#171c65"
    );

    gradient.addColorStop(
        0.30,
        "#080c31"
    );

    gradient.addColorStop(
        0.65,
        "#030519"
    );

    gradient.addColorStop(
        1,
        "#010207"
    );


    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* Twinkling background stars */

    backgroundStars.forEach(star => {

        const twinkle =
            0.5 +
            Math.sin(
                time * star.twinkle +
                star.phase
            ) * 0.45;


        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            `rgba(255,255,255,${twinkle})`;

        ctx.fill();

    });

}


/* ================================
   GALACTIC CORE
================================ */

function drawCore() {

    /*
       Larger glowing core
    */

    const core =
        ctx.createRadialGradient(
            centerX,
            centerY,
            0,
            centerX,
            centerY,
            245
        );


    core.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    core.addColorStop(
        0.06,
        "rgba(255,250,220,1)"
    );

    core.addColorStop(
        0.15,
        "rgba(255,220,140,.9)"
    );

    core.addColorStop(
        0.30,
        "rgba(255,100,220,.55)"
    );

    core.addColorStop(
        0.55,
        "rgba(100,100,255,.25)"
    );

    core.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle = core;


    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        250,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* ================================
   DRAW GALAXY
================================ */

function drawGalaxy() {

    galaxyStars.forEach(star => {

        /*
           Rotate star
        */

        star.angle += star.speed;


        /*
           Calculate orbit position
        */

        const x =
            centerX +
            Math.cos(star.angle) *
            star.radius;


        /*
           Flatten the galaxy to create
           a realistic spiral-disc look
        */

        const y =
            centerY +
            Math.sin(star.angle) *
            star.radius *
            0.43 +
            star.offsetY;


        /*
           Star glow
        */

        ctx.shadowBlur =
            star.size * 5;

        ctx.shadowColor =
            star.color;

        ctx.globalAlpha =
            star.alpha;

        ctx.fillStyle =
            star.color;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });


    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

}


/* ================================
   SHOOTING STARS
================================ */

function drawShootingStars() {

    for (
        let i = shootingStars.length - 1;
        i >= 0;
        i--
    ) {

        const s = shootingStars[i];


        const gradient =
            ctx.createLinearGradient(
                s.x - 120,
                s.y - 70,
                s.x,
                s.y
            );


        gradient.addColorStop(
            0,
            "rgba(255,255,255,0)"
        );

        gradient.addColorStop(
            1,
            `rgba(180,220,255,${s.life})`
        );


        ctx.strokeStyle = gradient;

        ctx.lineWidth = 3;


        ctx.beginPath();

        ctx.moveTo(
            s.x - 120,
            s.y - 70
        );

        ctx.lineTo(
            s.x,
            s.y
        );

        ctx.stroke();


        /*
           Bright shooting-star head
        */

        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ffffff";

        ctx.fillStyle =
            `rgba(255,255,255,${s.life})`;


        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.shadowBlur = 0;


        s.x += s.vx;
        s.y += s.vy;

        s.life -= 0.018;


        if (s.life <= 0) {

            shootingStars.splice(
                i,
                1
            );

        }

    }

}


/* ================================
   ANIMATION
================================ */

let lastShoot = 0;


function animate(time) {

    drawBackground(time);

    drawCore();

    drawGalaxy();

    drawShootingStars();


    /*
       Generate occasional
       shooting stars
    */

    if (
        time - lastShoot >
        1500 + Math.random() * 2500
    ) {

        createShootingStar();

        lastShoot = time;

    }


    requestAnimationFrame(
        animate
    );

}


/* Start animation */

requestAnimationFrame(
    animate
);

</script>

</body>
</html>
